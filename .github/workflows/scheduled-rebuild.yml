name: Scheduled site rebuild

# Fallback for when the app repository's release workflow is not set up.
# Cloudflare Pages only rebuilds when something is pushed or a deploy hook is
# called, so release data would otherwise go stale on this site.
#
# Requires the CLOUDFLARE_DEPLOY_HOOK_URL repository secret. Without it this
# workflow exits successfully and does nothing.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Call the Cloudflare deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a production build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not set; skipping the rebuild."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK_URL"
